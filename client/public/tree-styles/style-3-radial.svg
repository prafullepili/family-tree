<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Radial family tree</title>
  <desc id="desc">A family tree radiating from a focal couple through two outer generations.</desc>
  <defs><radialGradient id="bg"><stop stop-color="#23204F"/><stop offset="1" stop-color="#121214"/></radialGradient><linearGradient id="node" x2="1" y2="1"><stop stop-color="#4338CA"/><stop offset="1" stop-color="#0891B2"/></linearGradient></defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <g fill="none" stroke="#67E8F9" stroke-width="3" opacity=".55">
    <circle cx="500" cy="500" r="220" stroke-dasharray="4 14"/><circle cx="500" cy="500" r="390" stroke-dasharray="4 16"/>
    <path d="M500 385V250 M615 500H750 M500 615V750 M385 500H250 M419 419 344 344 M581 419 656 344 M581 581 656 656 M419 581 344 656"/>
    <path d="M500 250V110 M750 500H890 M500 750V890 M250 500H110 M344 344 225 225 M656 344 775 225 M656 656 775 775 M344 656 225 775"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" dominant-baseline="middle" fill="#F8FAFC">
    <g><circle cx="500" cy="500" r="115" fill="url(#node)" stroke="#A5F3FC" stroke-width="5"/><text x="500" y="483" font-size="23" font-weight="700">Focal Couple</text><text x="500" y="516" font-size="17" fill="#CFFAFE">Names</text></g>
    <g font-size="17" font-weight="600">
      <g><circle cx="500" cy="250" r="72" fill="#3159A8" stroke="#93C5FD" stroke-width="3"/><text x="500" y="250">Parent</text></g>
      <g><circle cx="750" cy="500" r="72" fill="#267A9A" stroke="#67E8F9" stroke-width="3"/><text x="750" y="500">Sibling</text></g>
      <g><circle cx="500" cy="750" r="72" fill="#238697" stroke="#5EEAD4" stroke-width="3"/><text x="500" y="750">Child</text></g>
      <g><circle cx="250" cy="500" r="72" fill="#394EA0" stroke="#A5B4FC" stroke-width="3"/><text x="250" y="500">Sibling</text></g>
      <g><circle cx="344" cy="344" r="62" fill="#365DA8" stroke="#93C5FD" stroke-width="3"/><text x="344" y="344">Parent</text></g>
      <g><circle cx="656" cy="344" r="62" fill="#2C6FA2" stroke="#7DD3FC" stroke-width="3"/><text x="656" y="344">Parent</text></g>
      <g><circle cx="656" cy="656" r="62" fill="#258292" stroke="#5EEAD4" stroke-width="3"/><text x="656" y="656">Child</text></g>
      <g><circle cx="344" cy="656" r="62" fill="#306A9E" stroke="#67E8F9" stroke-width="3"/><text x="344" y="656">Child</text></g>
    </g>
    <g font-size="14" fill="#D7F9FF">
      <g><circle cx="500" cy="110" r="46" fill="#223D78" stroke="#60A5FA" stroke-width="2"/><text x="500" y="110">Ancestor</text></g>
      <g><circle cx="890" cy="500" r="46" fill="#185E75" stroke="#22D3EE" stroke-width="2"/><text x="890" y="500">Family</text></g>
      <g><circle cx="500" cy="890" r="46" fill="#176B70" stroke="#2DD4BF" stroke-width="2"/><text x="500" y="890">Child</text></g>
      <g><circle cx="110" cy="500" r="46" fill="#293B7A" stroke="#818CF8" stroke-width="2"/><text x="110" y="500">Family</text></g>
      <g><circle cx="225" cy="225" r="46" fill="#294A82" stroke="#60A5FA" stroke-width="2"/><text x="225" y="225">Ancestor</text></g>
      <g><circle cx="775" cy="225" r="46" fill="#205A7A" stroke="#38BDF8" stroke-width="2"/><text x="775" y="225">Ancestor</text></g>
      <g><circle cx="775" cy="775" r="46" fill="#176B70" stroke="#2DD4BF" stroke-width="2"/><text x="775" y="775">Child</text></g>
      <g><circle cx="225" cy="775" r="46" fill="#265776" stroke="#22D3EE" stroke-width="2"/><text x="225" y="775">Child</text></g>
    </g>
  </g>
</svg>
