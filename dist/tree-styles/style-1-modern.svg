<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">Modern three generation family tree</title>
  <desc id="desc">A top-down family tree with grandparents, parents, aunts, uncles, and children.</desc>
  <rect width="1000" height="800" fill="#FAFAFA"/>
  <g fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 145V205H385V260 M390 145V205H615V260"/>
    <path d="M610 145V205H615"/>
    <path d="M780 145V205H615"/>
    <path d="M385 330V410H175V485 M385 410V485 M385 410H595V485"/>
    <path d="M615 330V410H805V485"/>
    <path d="M385 555V635H295V690 M385 635H475V690"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#2C3E50" text-anchor="middle" dominant-baseline="middle">
    <g><rect x="130" y="85" width="180" height="60" rx="16" fill="#EBF5FB" stroke="#AED6F1"/><text x="220" y="115">Grandfather (Name)</text></g>
    <g><rect x="300" y="85" width="180" height="60" rx="16" fill="#FDF2E9" stroke="#F5CBA7"/><text x="390" y="115">Grandmother (Name)</text></g>
    <g><rect x="520" y="85" width="180" height="60" rx="16" fill="#EBF5FB" stroke="#AED6F1"/><text x="610" y="115">Grandfather (Name)</text></g>
    <g><rect x="690" y="85" width="180" height="60" rx="16" fill="#FDF2E9" stroke="#F5CBA7"/><text x="780" y="115">Grandmother (Name)</text></g>
    <g><rect x="295" y="260" width="180" height="70" rx="16" fill="#EBF5FB" stroke="#AED6F1"/><text x="385" y="295">Father (Name)</text></g>
    <g><rect x="525" y="260" width="180" height="70" rx="16" fill="#FDF2E9" stroke="#F5CBA7"/><text x="615" y="295">Mother (Name)</text></g>
    <g><rect x="85" y="485" width="180" height="70" rx="16" fill="#FDF2E9" stroke="#F5CBA7"/><text x="175" y="520">Aunt (Name)</text></g>
    <g><rect x="295" y="485" width="180" height="70" rx="16" fill="#EBF5FB" stroke="#AED6F1"/><text x="385" y="520">Uncle (Name)</text></g>
    <g><rect x="505" y="485" width="180" height="70" rx="16" fill="#FDF2E9" stroke="#F5CBA7"/><text x="595" y="520">Aunt (Name)</text></g>
    <g><rect x="715" y="485" width="180" height="70" rx="16" fill="#EBF5FB" stroke="#AED6F1"/><text x="805" y="520">Uncle (Name)</text></g>
    <g><rect x="205" y="690" width="180" height="70" rx="16" fill="#EBF5FB" stroke="#AED6F1"/><text x="295" y="725">Son (Name)</text></g>
    <g><rect x="385" y="690" width="180" height="70" rx="16" fill="#FDF2E9" stroke="#F5CBA7"/><text x="475" y="725">Daughter (Name)</text></g>
  </g>
</svg>
