<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Horizontal dashboard family tree</title>
  <desc id="desc">A left-to-right family flow chart using modern profile cards.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0F9F76"/></marker>
  </defs>
  <style>.card{transition:opacity .18s ease,transform .18s ease;cursor:pointer}.card:hover{opacity:.78;transform:translateY(-3px)}.link{fill:none;stroke:#0F9F76;stroke-width:3;marker-end:url(#arrow)}</style>
  <rect width="1200" height="600" fill="#F5F7FA"/>
  <g class="links">
    <path class="link" d="M300 150H380Q410 150 410 180V260Q410 290 440 290H490"/>
    <path class="link" d="M300 410H380Q410 410 410 380V320Q410 290 440 290H490"/>
    <path class="link" d="M730 290H805Q830 290 830 260V150Q830 130 850 130H900"/>
    <path class="link" d="M730 290H805Q830 290 830 320V300Q830 310 850 310H900"/>
    <path class="link" d="M730 290H805Q830 290 830 350V470Q830 470 850 470H900"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <g class="card" filter="url(#shadow)" transform="translate(60 95)"><rect width="240" height="110" rx="16" fill="#FFF"/><circle cx="56" cy="55" r="32" fill="#DBEAFE"/><circle cx="56" cy="45" r="11" fill="#2563EB"/><path d="M35 74Q56 54 77 74" fill="#2563EB"/><text x="105" y="48" font-size="18" font-weight="700" fill="#172033">Grandfather</text><text x="105" y="75" font-size="14" fill="#64748B">Born 1942</text></g>
    <g class="card" filter="url(#shadow)" transform="translate(60 355)"><rect width="240" height="110" rx="16" fill="#FFF"/><circle cx="56" cy="55" r="32" fill="#FCE7F3"/><circle cx="56" cy="45" r="11" fill="#DB2777"/><path d="M35 74Q56 54 77 74" fill="#DB2777"/><text x="105" y="48" font-size="18" font-weight="700" fill="#172033">Grandmother</text><text x="105" y="75" font-size="14" fill="#64748B">Born 1946</text></g>
    <g class="card" filter="url(#shadow)" transform="translate(490 235)"><rect width="240" height="110" rx="16" fill="#FFF" stroke="#0F9F76" stroke-width="2"/><circle cx="56" cy="55" r="32" fill="#D1FAE5"/><circle cx="56" cy="45" r="11" fill="#059669"/><path d="M35 74Q56 54 77 74" fill="#059669"/><text x="105" y="48" font-size="18" font-weight="700" fill="#172033">Parent Name</text><text x="105" y="75" font-size="14" fill="#64748B">Born 1972</text></g>
    <g class="card" filter="url(#shadow)" transform="translate(900 75)"><rect width="240" height="110" rx="16" fill="#FFF"/><circle cx="56" cy="55" r="32" fill="#DBEAFE"/><circle cx="56" cy="45" r="11" fill="#2563EB"/><path d="M35 74Q56 54 77 74" fill="#2563EB"/><text x="105" y="48" font-size="18" font-weight="700" fill="#172033">Child One</text><text x="105" y="75" font-size="14" fill="#64748B">Born 1998</text></g>
    <g class="card" filter="url(#shadow)" transform="translate(900 255)"><rect width="240" height="110" rx="16" fill="#FFF"/><circle cx="56" cy="55" r="32" fill="#FCE7F3"/><circle cx="56" cy="45" r="11" fill="#DB2777"/><path d="M35 74Q56 54 77 74" fill="#DB2777"/><text x="105" y="48" font-size="18" font-weight="700" fill="#172033">Child Two</text><text x="105" y="75" font-size="14" fill="#64748B">Born 2001</text></g>
    <g class="card" filter="url(#shadow)" transform="translate(900 415)"><rect width="240" height="110" rx="16" fill="#FFF"/><circle cx="56" cy="55" r="32" fill="#E0E7FF"/><circle cx="56" cy="45" r="11" fill="#4F46E5"/><path d="M35 74Q56 54 77 74" fill="#4F46E5"/><text x="105" y="48" font-size="18" font-weight="700" fill="#172033">Child Three</text><text x="105" y="75" font-size="14" fill="#64748B">Born 2005</text></g>
  </g>
</svg>
